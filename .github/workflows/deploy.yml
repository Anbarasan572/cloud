name: Deploy Cloud to GCP

on:
  push:
    branches:
      - backend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check VM Connectivity
        run: |
          echo "Testing connection to GCP VM..."
          timeout 10 bash -c "</dev/tcp/${{ secrets.GCP_HOST }}/22" \
            && echo "Port 22 is reachable" \
            || echo "Port 22 is NOT reachable"

      - name: Deploy to GCP VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_KEY }}
          port: 22
          timeout: 30s
          script: |
            echo "Starting deployment..."

            cd ~/cloud

            echo "Updating repository..."
            git fetch origin backend
            git reset --hard origin/backend

            cd Backend

            echo "Building Docker image..."
            sudo docker build -t cloud-backend .

            echo "Stopping old container..."
            sudo docker stop cloud-backend || true
            sudo docker rm cloud-backend || true

            echo "Starting new container..."
            sudo docker run -d \
              --name cloud-backend \
              --restart unless-stopped \
              -p 5000:5000 \
              -v ~/cloudasset-data:/app/instance \
              cloud-backend

            echo "Reloading Nginx..."
            sudo systemctl reload nginx

            echo "Deployment completed successfully!"