name: Deploy CloudAsset to GCP

on:
  push:
    branches:
      - backend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check VM Connectivity
        run: |
          echo "Testing connection to GCP VM..."
          timeout 10 bash -c "</dev/tcp/${{ secrets.GCP_HOST }}/22" \
            && echo "Port 22 is reachable" \
            || echo "Port 22 is NOT reachable"

      - name: Deploy to GCP VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_KEY }}
          port: 22
          timeout: 30s
          script: |
            cd ~/cloud
            git pull origin backend

            cd Backend

            sudo docker build -t cloudasset-backend .

            sudo docker stop cloudasset-backend || true
            sudo docker rm cloudasset-backend || true

            sudo docker run -d \
              --name cloudasset-backend \
              --restart unless-stopped \
              -p 5000:5000 \
              -v ~/cloudasset-data:/app/instance \
              cloudasset-backend

            sudo systemctl reload nginx