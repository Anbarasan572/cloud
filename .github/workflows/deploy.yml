name: Deploy Cloud to GCP

on:
  push:
    branches:
      - backend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GCP VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_KEY }}
          port: 22
          timeout: 30s

          script: |
            set -e

            echo "========================================"
            echo "Starting Cloud Deployment..."
            echo "========================================"

            cd ~/cloud

            echo "Updating repository..."
            git fetch origin backend
            git reset --hard origin/backend

            echo "========================================"
            echo "Deploying Frontend..."
            echo "========================================"

            sudo mkdir -p /var/www/cloudasset

            sudo rm -rf /var/www/cloudasset/*

            sudo cp -r ~/cloud/Frontend/* /var/www/cloudasset/

            sudo chown -R www-data:www-data /var/www/cloudasset

            echo "Frontend deployed successfully!"

            echo "========================================"
            echo "Deploying Backend..."
            echo "========================================"

            cd ~/cloud/Backend

            echo "Building Docker image..."
            sudo docker build -t cloudasset-backend .

            echo "Stopping old container..."
            sudo docker stop cloudasset-backend || true
            sudo docker rm cloudasset-backend || true

            echo "Starting new container..."
            sudo docker run -d \
              --name cloudasset-backend \
              --restart unless-stopped \
              -p 5000:5000 \
              -v ~/cloudasset-data:/app/instance \
              cloudasset-backend

            echo "Reloading Nginx..."
            sudo systemctl reload nginx

            echo "========================================"
            echo "Deployment completed successfully!"
            echo "Frontend + Backend deployed!"
            echo "========================================"