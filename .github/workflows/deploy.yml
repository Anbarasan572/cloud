name: Deploy CloudAsset to GCP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GCP VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            cd ~/cloud

            echo "Pulling latest code..."
            git pull origin main

            echo "Stopping old backend..."
            sudo docker stop cloudasset-backend || true
            sudo docker rm cloudasset-backend || true

            echo "Building backend..."
            cd ~/cloud/Backend
            sudo docker build -t cloudasset-backend .

            echo "Starting backend..."
            sudo docker run -d \
              --name cloudasset-backend \
              --restart unless-stopped \
              -p 5000:5000 \
              -v ~/cloudasset-data:/app/instance \
              cloudasset-backend

            echo "Deploying frontend..."
            sudo rm -rf /var/www/cloudasset/*
            sudo cp -r ~/cloud/Frontend/* /var/www/cloudasset/

            echo "Restarting Nginx..."
            sudo systemctl restart nginx

            echo "Deployment completed successfully!"